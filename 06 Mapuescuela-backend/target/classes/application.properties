# =====================================================================
# Servidor
# =====================================================================
# BaseWorker usa este mismo puerto (@Value("${server.port}")) para
# construir la URL con la que los workers llaman a PedidoResource,
# NotificacionResource e InventarioResource, que viven en esta misma
# aplicacion. No cambiar sin revisar BaseWorker.baseUrl().
server.port=8081

# =====================================================================
# Base de datos: H2 embebida (archivo local, no requiere instalar nada)
# =====================================================================
spring.datasource.url=jdbc:h2:file:./data/mapuescuela;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2 (util para revisar las tablas "notificaciones" e
# "inventario" sin instalar un cliente SQL aparte):
# http://localhost:8081/h2-console  (JDBC URL: jdbc:h2:file:./data/mapuescuela)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================================================================
# Conexion a Flowable Trial -- intento con prefijo /work
# =====================================================================
# El modo automatico (sin base-url) y el intento anterior con
# context-path=/external-job-api solo dieron 301/404. Probamos ahora
# con el prefijo "work", ya que ese es el nombre interno de la app de
# Flowable que corre el motor de procesos (visto en flowable-work.war).
flowable.external.worker.rest.base-url=https://trial.flowable.com
flowable.external.worker.rest.context-path=/work/external-job-api
flowable.external.worker.rest.authentication.bearer.token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJmbG93YWJsZS13b3JrIiwic3ViIjoidmFsZGVycmFtYXlvcmRhbkBvdXRsb29rLmNvbSIsImZsd1RlbmFudCI6InRlbmFudElEX3ZhbGRlcnJhbWF5b3JkYW5Ab3V0bG9vay5jb20iLCJleHAiOjE4MjA5NDgxNjcsImlhdCI6MTc4OTQxMjE2NywianRpIjoiZjE4YzNlYjEtYjA2ZC0xMWYxLTgzNGUtOGE3YWZhODk3ZjIyIn0.WHs70PaIiI5mOfAJyszWAnCoQhSF0fBYwrSODweXYxk

# Identificador de este worker (aparece en Flowable para saber quien
# esta reclamando los jobs). Pueden dejarlo asi.
flowable.external.worker.workerId=mapuescuela-grupo-7

# IMPORTANTE: aunque la documentacion de Flowable dice que estas tienen
# valor por defecto (30s, 5m, etc.), en la practica esta version de la
# libreria no los aplica solos y falla al arrancar con "pollingInterval
# must not be null" si no se ponen explicitos.
flowable.external.worker.polling-interval=30s
flowable.external.worker.lock-duration=5m
flowable.external.worker.number-of-retries=5
flowable.external.worker.number-of-tasks=1
flowable.external.worker.concurrency=1
