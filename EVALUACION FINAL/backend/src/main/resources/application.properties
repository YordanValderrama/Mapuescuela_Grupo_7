# =====================================================================
# Servidor
# =====================================================================
# BaseWorker usa este mismo puerto (@Value("${server.port}")) para
# construir la URL con la que los workers llaman a PedidoResource,
# NotificacionResource e InventarioResource, que viven en esta misma
# aplicacion. No cambiar sin revisar BaseWorker.baseUrl().
server.port=8081

# =====================================================================
# Base de datos: SQLite (archivo unico en ./data/mapuescuela.db)
# =====================================================================
spring.datasource.url=jdbc:sqlite:./data/mapuescuela.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Carpeta donde se guardan los comprobantes subidos por los clientes
# (POST /pedidos/{idPedido}/comprobante). Se crea sola si no existe.
mapuescuela.uploads.dir=./data/uploads

# =====================================================================
# Conexion a Flowable TRIAL (trial.flowable.com)
# =====================================================================
# Esta es la variante para probar con una cuenta PERSONAL de Flowable
# Trial (no la instancia de IPLACEX). Si tu cuenta es de
# trial.flowable.com, genera un Personal Access Token desde tu usuario
# -> Settings -> Access Tokens -> New token, y pegalo abajo.
#
# El context-path se deja en su valor por defecto documentado
# (/external-job-api). NO agregar prefijo "/work" -- eso se probo y
# dio una redireccion (302) a una pantalla de login, no a la API.
flowable.external.worker.rest.base-url=https://trial.flowable.com
flowable.external.worker.rest.authentication.bearer.token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJmbG93YWJsZS13b3JrIiwic3ViIjoiZXAzMDI3MDBAZ21haWwuY29tIiwiZmx3VGVuYW50IjoidGVuYW50SURfZXAzMDI3MDBAZ21haWwuY29tIiwiZXhwIjoxODIxNjY1Njg4LCJpYXQiOjE3OTAxMjk2ODgsImp0aSI6IjhkMTI3YjNmLWI2ZjQtMTFmMS05NWI0LThlZGU2Y2FhMjMwNSJ9.0JrEw9WGNYCj56ntzVhVN_v2R9UtEy-4T4ZgvksRKkY
flowable.external.worker.rest.context-path=/work/external-job-api

# Identificador de este worker (aparece en Flowable para saber quien
# esta reclamando los jobs). Pueden dejarlo asi.
flowable.external.worker.workerId=mapuescuela-grupo-7

# IMPORTANTE: aunque la documentacion de Flowable dice que estas tienen
# valor por defecto (30s, 5m, etc.), en la practica esta version de la
# libreria no los aplica solos y falla al arrancar con "pollingInterval
# must not be null" si no se ponen explicitos.
flowable.external.worker.polling-interval=30s
flowable.external.worker.lock-duration=5m
flowable.external.worker.number-of-retries=5
flowable.external.worker.number-of-tasks=1
flowable.external.worker.concurrency=1

# =====================================================================
# NUEVO: Process REST API -- para INICIAR el proceso desde PedidoResource
# (ver FlowableProcessClient). Esto es lo que la retroalimentación de
# Entrega 3 marco en 0/15 ("Proceso ejecutandose"): las External Workers
# ya estaban listas para reclamar jobs, pero ningun proceso se llegaba a
# iniciar porque crearPedido() solo guardaba en la base de datos.
#
# Mismo cambio de host que arriba: iplacex.cloud.flowable.com, no
# trial.flowable.com.
# =====================================================================
flowable.process.rest.base-url=https://trial.flowable.com
flowable.process.rest.context-path=/work/process-api
# TODO (equipo): reemplazar por la "key" real del proceso BPMN (atributo
# id de <process id="..."> en el modelo, visible tambien en Flowable
# Modeler/Design). Mientras diga REEMPLAZAR_KEY_PROCESO, FlowableProcessClient
# no intenta iniciar el proceso (solo deja el pedido guardado en la DB).
flowable.process.rest.definition-key=procesoDeVentaMauescuelaTOBE
