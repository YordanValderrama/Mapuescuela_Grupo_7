<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapuescuela - Carrito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <nav class="navbar shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center m-0" href="catalogo.html">
        <img src="logo.png" alt="Mapuescuela" class="brand-logo" onerror="this.style.display='none'; document.getElementById('alt-brand-text').style.display='block';">
        <span id="alt-brand-text" style="display:none; color: var(--primary-blue); font-weight: 700; font-size: 1.3rem;">Mapuescuela</span>
      </a>
      <a href="catalogo.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Seguir viendo productos</a>
    </div>
  </nav>

  <div class="container my-5" style="max-width: 700px;">
    <div class="card card-main">
      <div class="card-header card-top d-flex align-items-center">
        <i class="bi bi-cart3 me-2 fs-5"></i><span>Tu carrito</span>
      </div>
      <div class="card-body p-4">
        <div id="contenidoCarrito"></div>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    function render() {
      const cont = document.getElementById('contenidoCarrito');
      const item = getCarrito();

      if (!item) {
        cont.innerHTML = `
          <div class="text-center py-4">
            <i class="bi bi-cart-x fs-1 text-muted d-block mb-3"></i>
            <p class="text-muted">Tu carrito está vacío.</p>
            <a href="catalogo.html" class="btn btn-blue">Ir al catálogo</a>
          </div>`;
        return;
      }

      const precio = PRECIOS[item.producto] || 5000;
      const total = precio * item.cantidad;

      cont.innerHTML = `
        <div class="d-flex justify-content-between align-items-center border rounded p-3 mb-3">
          <div>
            <strong class="d-block">${item.producto}</strong>
            <span class="text-muted small">${formatearCLP(precio)} c/u</span>
          </div>
          <div class="d-flex align-items-center gap-2">
            <button class="btn btn-sm btn-outline-secondary" id="btnMenos">-</button>
            <span class="fw-bold" id="cantidadActual">${item.cantidad}</span>
            <button class="btn btn-sm btn-outline-secondary" id="btnMas">+</button>
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
          <span class="text-muted">Total</span>
          <span class="fs-5 fw-bold text-success">${formatearCLP(total)}</span>
        </div>
        <div class="alert alert-light border small text-muted">
          <i class="bi bi-info-circle me-1"></i>
          Por ahora Mapuescuela procesa un producto por pedido. Si agregas otro producto desde el catálogo, reemplazará a este.
        </div>
        <div class="d-flex justify-content-between">
          <button class="btn btn-outline-danger" id="btnVaciar"><i class="bi bi-trash me-1"></i>Vaciar carrito</button>
          <button class="btn btn-blue" id="btnContinuar">Continuar con la compra <i class="bi bi-arrow-right ms-1"></i></button>
        </div>`;

      document.getElementById('btnMas').onclick = () => {
        item.cantidad = Math.min(10, item.cantidad + 1);
        setCarrito(item);
        render();
      };
      document.getElementById('btnMenos').onclick = () => {
        item.cantidad = Math.max(1, item.cantidad - 1);
        setCarrito(item);
        render();
      };
      document.getElementById('btnVaciar').onclick = () => {
        limpiarCarrito();
        render();
      };
      document.getElementById('btnContinuar').onclick = () => {
        window.location.href = 'pantalla1.html';
      };
    }

    render();
  </script>
</body>
</html>
