<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapuescuela - Pedido despachado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <nav class="navbar shadow-sm">
    <div class="container justify-content-center">
      <a class="navbar-brand d-flex align-items-center m-0" href="index.html">
        <img src="logo.png" alt="Mapuescuela" class="brand-logo">
      </a>
    </div>
  </nav>

  <main class="container my-5" style="max-width: 760px;">
    <div id="cargando" class="card card-main">
      <div class="card-body p-5 text-center">
        <div class="spinner-border text-primary mb-3" role="status" aria-label="Cargando"></div>
        <h1 class="h4 fw-bold">Confirmando el despacho</h1>
        <p id="estado" class="text-muted mb-3" role="status">Consultando el estado del pedido...</p>
        <button id="revisar" type="button" class="btn btn-outline-primary">Revisar ahora</button>
      </div>
    </div>

    <div id="confirmacion" class="card card-main d-none">
      <div class="card-header card-top-success d-flex align-items-center">
        <i class="bi bi-truck me-2 fs-5" aria-hidden="true"></i><span>Pedido despachado</span>
      </div>
      <div class="card-body p-4 p-md-5 text-center">
        <div class="status-icon-circle" style="background:#dcfce7; color:#16a34a;">
          <i class="bi bi-check-lg" aria-hidden="true"></i>
        </div>
        <h1 class="h4 fw-bold mb-2">¡Tu pedido fue despachado!</h1>
        <p class="text-muted mb-4">Pedido <strong id="numeroPedido"></strong></p>

        <div class="summary-card p-3 mb-3 text-start">
          <h2 class="h6 fw-bold mb-3">Datos del pedido</h2>
          <div id="datosPedido" class="row g-3"></div>
        </div>
        <div class="summary-card p-3 mb-4 text-start">
          <h2 class="h6 fw-bold mb-3">Datos del despacho</h2>
          <div id="datosDespacho" class="row g-3"></div>
        </div>

        <div class="alert alert-success text-start mb-4">
          <i class="bi bi-info-circle me-2" aria-hidden="true"></i>
          Tu pedido salió a despacho. Conserva el número de pedido y, si corresponde, el número de seguimiento.
        </div>
        <a href="index.html" class="btn btn-blue">Volver al inicio</a>
      </div>
    </div>
  </main>

  <script src="api.js"></script>
  <script>
    const nPedido = new URLSearchParams(window.location.search).get('nPedido');
    const estado = document.getElementById('estado');
    let consultando = false;

    function agregarDato(contenedor, etiqueta, valor, anchoCompleto = false) {
      const columna = document.createElement('div');
      columna.className = anchoCompleto ? 'col-12' : 'col-md-6';
      const titulo = document.createElement('span');
      titulo.className = 'text-muted small d-block';
      titulo.textContent = etiqueta;
      const contenido = document.createElement('strong');
      contenido.className = 'text-break';
      contenido.textContent = valor == null || valor === '' ? 'No informado' : String(valor);
      columna.append(titulo, contenido);
      contenedor.appendChild(columna);
    }

    async function consultarDespacho() {
      if (consultando) return;
      if (!nPedido) {
        estado.textContent = 'Falta el número de pedido. Vuelve a la pantalla de despacho para buscarlo.';
        return;
      }
      consultando = true;
      try {
        const pedido = await obtenerPedido(nPedido);
        if (!pedido) {
          estado.textContent = 'No se encontró el pedido indicado.';
          return;
        }
        if (pedido.modalidadEntrega !== 'reparto_domicilio') {
          estado.textContent = 'Este pedido no corresponde a despacho a domicilio.';
          return;
        }
        const respuesta = await fetch(API_BASE_URL + '/pedidos/' + encodeURIComponent(nPedido) + '/entrega');
        if (!respuesta.ok) {
          estado.textContent = 'Todavía no se ha registrado el despacho de este pedido.';
          return;
        }
        const entrega = await respuesta.json();
        if (entrega.tipo !== 'DESPACHO') {
          estado.textContent = 'Este pedido no tiene un despacho registrado.';
          return;
        }
        const avisos = await obtenerNotificaciones(nPedido);
        if (!avisos.some(aviso => aviso.tipo === 'ENVIO_DESPACHADO')) {
          estado.textContent = 'El despacho está registrado. Esperando la confirmación de envío...';
          return;
        }

        document.getElementById('numeroPedido').textContent = pedido.idPedido;
        const datosPedido = document.getElementById('datosPedido');
        const datosDespacho = document.getElementById('datosDespacho');
        datosPedido.replaceChildren();
        datosDespacho.replaceChildren();
        agregarDato(datosPedido, 'Nombre de quien realizó el pedido', pedido.nombreCliente);
        agregarDato(datosPedido, 'RUT', pedido.rutCliente);
        agregarDato(datosPedido, 'Teléfono', pedido.telefonoCliente);
        agregarDato(datosPedido, 'Correo', pedido.correoCliente);
        agregarDato(datosPedido, 'Producto', pedido.producto);
        agregarDato(datosPedido, 'Cantidad', pedido.cantidad);
        agregarDato(datosDespacho, 'Dirección de entrega', pedido.direccion, true);
        agregarDato(datosDespacho, 'Comuna', pedido.comuna);
        agregarDato(datosDespacho, 'Región', pedido.region);
        agregarDato(datosDespacho, 'Empresa transportista', entrega.empresa);
        agregarDato(datosDespacho, 'Número de seguimiento', entrega.numeroSeguimiento);
        agregarDato(datosDespacho, 'Fecha de registro', entrega.fechaRegistro ? entrega.fechaRegistro.replace('T', ' ').slice(0, 16) : null);
        document.getElementById('cargando').classList.add('d-none');
        document.getElementById('confirmacion').classList.remove('d-none');
        clearInterval(actualizacion);
      } catch (error) {
        estado.textContent = 'No se pudo consultar el despacho. Se intentará nuevamente.';
      } finally {
        consultando = false;
      }
    }

    document.getElementById('revisar').addEventListener('click', consultarDespacho);
    const actualizacion = setInterval(consultarDespacho, 5000);
    consultarDespacho();
  </script>
</body>
</html>
