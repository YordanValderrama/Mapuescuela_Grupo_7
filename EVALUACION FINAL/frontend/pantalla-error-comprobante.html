<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapuescuela - Error en el Comprobante</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <nav class="navbar shadow-sm">
    <div class="container justify-content-center">
      <a class="navbar-brand d-flex align-items-center m-0" href="catalogo.html">
        <img src="logo.png" alt="Mapuescuela" class="brand-logo" onerror="this.style.display='none'; document.getElementById('alt-brand-text').style.display='block';">
        <span id="alt-brand-text" style="display:none; color: var(--primary-blue); font-weight: 700; font-size: 1.3rem;">Mapuescuela</span>
      </a>
    </div>
  </nav>

  <div class="container my-5" style="max-width: 700px;">
    <div class="card card-main">
      <div class="card-header card-top-warning d-flex align-items-center">
        <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i><span>Hubo un problema con tu comprobante</span>
      </div>
      <div class="card-body p-5 text-center">
        <div class="status-icon-circle" style="background:#fef3c7; color:#d97706;">
          <i class="bi bi-file-earmark-excel"></i>
        </div>
        <h4 class="fw-bold mb-2">No pudimos procesar tu comprobante</h4>
        <p class="text-muted mb-4">Pedido <strong id="nPedido">--</strong></p>

        <div class="alert alert-warning text-start mb-4" id="motivoAlerta">
          <i class="bi bi-info-circle me-2"></i>
          El voluntario indicó que el archivo no se pudo leer (formato dañado o ilegible).
          Por favor, vuelve a subir tu comprobante.
        </div>

        <form id="formReenvio" class="text-start">
          <label for="nuevoComprobante" class="form-label fw-medium">Subir comprobante nuevamente: *</label>
          <input class="form-control mb-3" type="file" id="nuevoComprobante" accept="image/*,.pdf" required>
          <button type="submit" class="btn btn-blue w-100">
            <i class="bi bi-cloud-arrow-up me-2"></i>Reenviar comprobante
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const nPedido = params.get('nPedido');
    document.getElementById('nPedido').innerText = nPedido || '--';

    (async () => {
      const notificaciones = await obtenerNotificaciones(nPedido);
      const ultima = notificaciones.find(n => n.tipo === 'PAGO_PENDIENTE');
      if (ultima && ultima.mensaje) {
        document.getElementById('motivoAlerta').innerHTML =
            `<i class="bi bi-info-circle me-2"></i>${ultima.mensaje}`;
      }
    })();

    document.getElementById('formReenvio').addEventListener('submit', async function (e) {
      e.preventDefault();
      const archivo = document.getElementById('nuevoComprobante').files[0];
      const btn = e.submitter;
      if (btn) { btn.disabled = true; btn.innerText = 'Enviando...'; }

      try {
        await subirComprobante(nPedido, archivo);
        window.location.href = `pantalla-esperando.html?nPedido=${encodeURIComponent(nPedido)}`;
      } catch (error) {
        alert('No se pudo reenviar el comprobante: ' + error.message);
        if (btn) { btn.disabled = false; btn.innerText = 'Reenviar comprobante'; }
      }
    });
  </script>
</body>
</html>
