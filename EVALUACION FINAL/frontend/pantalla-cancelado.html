<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapuescuela - Pedido Cancelado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <nav class="navbar shadow-sm">
    <div class="container justify-content-center">
      <a class="navbar-brand d-flex align-items-center m-0" href="catalogo.html">
        <img src="logo.png" alt="Mapuescuela" class="brand-logo" onerror="this.style.display='none'; document.getElementById('alt-brand-text').style.display='block';">
        <span id="alt-brand-text" style="display:none; color: var(--primary-blue); font-weight: 700; font-size: 1.3rem;">Mapuescuela</span>
      </a>
    </div>
  </nav>

  <div class="container my-5" style="max-width: 700px;">
    <div class="card card-main">
      <div class="card-header" style="background:#475569; color:#fff; font-weight:600; border-radius:12px 12px 0 0; padding:1rem 1.5rem;">
        <i class="bi bi-clock-history me-2"></i><span>Pedido cancelado por vencimiento</span>
      </div>
      <div class="card-body p-5 text-center">
        <div class="status-icon-circle" style="background:#e2e8f0; color:#475569;">
          <i class="bi bi-hourglass-bottom"></i>
        </div>
        <h4 class="fw-bold mb-2">Tu pedido fue cancelado</h4>
        <p class="text-muted mb-4">Pedido <strong id="nPedido">--</strong></p>

        <div class="summary-card p-3 mb-4 text-start" id="detallePedido">
          <div class="text-center text-muted">Cargando datos del pedido...</div>
        </div>

        <div class="alert alert-secondary text-start">
          <i class="bi bi-info-circle me-2"></i>
          No recibimos tu comprobante de pago dentro de las 24 horas establecidas, por lo
          que el pedido se canceló automáticamente y el stock reservado fue liberado.
        </div>

        <a href="catalogo.html" class="btn btn-blue mt-3">Hacer un nuevo pedido</a>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const nPedido = params.get('nPedido');
    document.getElementById('nPedido').innerText = nPedido || '--';

    (async () => {
      const pedido = await obtenerPedido(nPedido);
      if (!pedido) return;
      document.getElementById('detallePedido').innerHTML = `
        <div class="row g-2">
          <div class="col-6"><span class="text-muted small d-block">Cliente:</span><strong>${pedido.nombreCliente || '--'}</strong></div>
          <div class="col-6"><span class="text-muted small d-block">Producto:</span><strong>${pedido.producto} (x${pedido.cantidad})</strong></div>
          <div class="col-12"><span class="text-muted small d-block">Estado:</span><strong>${pedido.estadoPago}</strong></div>
        </div>`;
    })();
  </script>
</body>
</html>
