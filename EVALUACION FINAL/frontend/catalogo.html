<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapuescuela - Catálogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <nav class="navbar shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center m-0" href="catalogo.html">
        <img src="logo.png" alt="Mapuescuela" class="brand-logo" onerror="this.style.display='none'; document.getElementById('alt-brand-text').style.display='block';">
        <span id="alt-brand-text" style="display:none; color: var(--primary-blue); font-weight: 700; font-size: 1.3rem;">Mapuescuela</span>
      </a>
      <a href="carrito.html" class="btn btn-outline-primary position-relative">
        <i class="bi bi-cart3"></i> Carrito
        <span class="badge bg-danger rounded-pill cart-badge" id="badgeCarrito" style="display:none;">1</span>
      </a>
    </div>
  </nav>

  <div class="container my-5">
    <h2 class="fw-bold mb-1" style="color: var(--primary-blue);">Catálogo de productos</h2>
    <p class="text-muted mb-4">Elige un producto para agregarlo a tu carrito.</p>

    <div class="row g-4" id="grillaProductos"></div>
  </div>

  <script src="api.js"></script>
  <script>
    const grilla = document.getElementById('grillaProductos');
    async function mostrarCatalogo() {
      try {
        const productos = (await listarProductos()).filter(p => p.activo && p.precio > 0);
        grilla.replaceChildren();
        for (const p of productos) {
          const col = document.createElement('div');
          col.className = 'col-sm-6 col-lg-3';
          const card = document.createElement('div'); card.className = 'product-card p-3';
          if (p.imagenUrl && /^https?:\/\//i.test(p.imagenUrl)) {
            const img = document.createElement('img'); img.src = p.imagenUrl;
            img.alt = p.producto; img.className = 'img-fluid rounded mb-2';
            img.style.maxHeight = '160px'; card.appendChild(img);
          }
          const title = document.createElement('h6'); title.className='fw-bold'; title.textContent=p.producto;
          const desc = document.createElement('p'); desc.className='text-muted small'; desc.textContent=p.descripcion || '';
          const price = document.createElement('p'); price.className='fw-bold text-primary'; price.textContent=formatearCLP(p.precio);
          const stock = document.createElement('p'); stock.className='small'; stock.textContent='Disponibles: ' + p.stockDisponible;
          const button = document.createElement('button'); button.className='btn btn-blue w-100 btn-sm';
          button.dataset.producto=p.producto; button.textContent='Agregar al carrito';
          if (p.stockDisponible <= 0) { button.disabled=true; button.textContent='Agotado'; }
          card.append(title,desc,price,stock,button); col.appendChild(card); grilla.appendChild(col);
        }
      } catch (error) {
        grilla.textContent = 'No se pudo cargar el catálogo. Revisa que el backend esté iniciado. ' + error.message;
      }
    }
    mostrarCatalogo();

    grilla.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-producto]');
      if (!btn) return;
      setCarrito({ producto: btn.dataset.producto, cantidad: 1 });
      window.location.href = 'carrito.html';
    });

    function actualizarBadge() {
      const item = getCarrito();
      const badge = document.getElementById('badgeCarrito');
      if (item) {
        badge.style.display = 'inline-block';
        badge.innerText = item.cantidad;
      }
    }
    actualizarBadge();
  </script>
</body>
</html>
