<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapuescuela - Pago Aprobado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <nav class="navbar shadow-sm">
    <div class="container justify-content-center">
      <a class="navbar-brand d-flex align-items-center m-0" href="catalogo.html">
        <img src="logo.png" alt="Mapuescuela" class="brand-logo" onerror="this.style.display='none'; document.getElementById('alt-brand-text').style.display='block';">
        <span id="alt-brand-text" style="display:none; color: var(--primary-blue); font-weight: 700; font-size: 1.3rem;">Mapuescuela</span>
      </a>
    </div>
  </nav>

  <div class="container my-5" style="max-width: 700px;">
    <div class="card card-main">
      <div class="card-header card-top-success d-flex align-items-center">
        <i class="bi bi-check-circle-fill me-2 fs-5"></i><span>Pago aprobado</span>
      </div>
      <div class="card-body p-5 text-center">
        <div class="status-icon-circle" style="background:#dcfce7; color:#16a34a;">
          <i class="bi bi-check-lg"></i>
        </div>
        <h4 class="fw-bold mb-2">¡Tu pago fue aprobado!</h4>
        <p class="text-muted mb-4">Pedido <strong id="nPedido">--</strong></p>

        <div class="summary-card p-3 mb-4 text-start" id="detallePedido">
          <div class="text-center text-muted">Cargando datos del pedido...</div>
        </div>

        <div class="alert alert-success text-start" id="mensajeEntrega"></div>

        <a href="catalogo.html" class="btn btn-blue mt-3">Volver al catálogo</a>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const nPedido = params.get('nPedido');
    document.getElementById('nPedido').innerText = nPedido || '--';

    (async () => {
      const pedido = await obtenerPedido(nPedido);
      if (!pedido) return;

      document.getElementById('detallePedido').innerHTML = `
        <div class="row g-2">
          <div class="col-6"><span class="text-muted small d-block">Cliente:</span><strong>${pedido.nombreCliente || '--'}</strong></div>
          <div class="col-6"><span class="text-muted small d-block">Producto:</span><strong>${pedido.producto} (x${pedido.cantidad})</strong></div>
          <div class="col-6"><span class="text-muted small d-block">Estado:</span><strong class="text-success">${pedido.estadoPago}</strong></div>
          <div class="col-6"><span class="text-muted small d-block">Modalidad:</span><strong>${pedido.modalidadEntrega || '--'}</strong></div>
        </div>`;

      const esDomicilio = (pedido.modalidadEntrega || '').includes('domicilio');
      document.getElementById('mensajeEntrega').innerHTML = esDomicilio
        ? '<i class="bi bi-truck me-2"></i>Tu pedido está siendo preparado para despacho a domicilio. Te avisaremos cuando salga.'
        : '<i class="bi bi-shop me-2"></i>Tu pedido está listo para retiro en tienda (Av. Padre Hurtado #1234). Presenta tu número de pedido.';
    })();
  </script>
</body>
</html>
