<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapuescuela - Esperando validación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <nav class="navbar shadow-sm">
    <div class="container justify-content-center">
      <a class="navbar-brand d-flex align-items-center m-0" href="catalogo.html">
        <img src="logo.png" alt="Mapuescuela" class="brand-logo" onerror="this.style.display='none'; document.getElementById('alt-brand-text').style.display='block';">
        <span id="alt-brand-text" style="display:none; color: var(--primary-blue); font-weight: 700; font-size: 1.3rem;">Mapuescuela</span>
      </a>
    </div>
  </nav>

  <div class="container my-5" style="max-width: 650px;">
    <div class="card card-main">
      <div class="card-body p-5 text-center">
        <div class="spinner-border text-primary spinner-wait mb-4" role="status"></div>
        <h4 class="fw-bold mb-2">Esperando validación de tu comprobante</h4>
        <p class="text-muted mb-1">Pedido <strong id="nPedidoTexto">--</strong></p>
        <p class="text-muted small">
          El voluntario de Mapuescuela está revisando tu comprobante.
          Esta pantalla se actualiza sola -- no la cierres.
        </p>
        <p class="small text-muted mt-4" id="ultimaConsulta"></p>
        <button class="btn btn-outline-primary btn-sm mt-2" id="btnRevisarAhora">
          <i class="bi bi-arrow-clockwise me-1"></i> Revisar ahora
        </button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const nPedido = params.get('nPedido');

    if (!nPedido) {
      window.location.href = 'catalogo.html';
    }
    document.getElementById('nPedidoTexto').innerText = nPedido;

    async function revisarEstado() {
      document.getElementById('ultimaConsulta').innerText =
          'Última consulta: ' + new Date().toLocaleTimeString('es-CL');

      const pedido = await obtenerPedido(nPedido);
      if (!pedido) return;

      if (pedido.estadoPago === 'APROBADO') {
        window.location.href = `pantalla-aprobado.html?nPedido=${nPedido}`;
        return;
      }
      if (pedido.estadoPago === 'RECHAZADO') {
        window.location.href = `pantalla-rechazado.html?nPedido=${nPedido}`;
        return;
      }
      if (pedido.estadoPago === 'CANCELADO_POR_TIEMPO') {
        window.location.href = `pantalla-cancelado.html?nPedido=${nPedido}`;
        return;
      }
      if (pedido.estadoPago === 'ERROR_COMPROBANTE') {
        window.location.href = `pantalla-error-comprobante.html?nPedido=${nPedido}`;
        return;
      }
    }

    document.getElementById('btnRevisarAhora').addEventListener('click', revisarEstado);
    revisarEstado();
    setInterval(revisarEstado, 5000);
  </script>
</body>
</html>
