<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapuescuela | Registrar despacho a domicilio</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="estilos.css"></head><body><nav class="navbar shadow-sm volunteer-nav" aria-label="Navegación del voluntariado"><div class="container"><span class="volunteer-brand"><img src="logo.png" alt="" aria-hidden="true">Mapuescuela</span><div class="volunteer-links"><a href="index.html">Inicio</a><a href="pantalla3.html">Pedidos</a><a href="registrar-retiro.html">Retiro</a><a href="registrar-despacho.html" aria-current="page">Despacho</a><a href="gestionar-productos.html">Productos</a></div></div></nav><main class="container my-4" style="max-width:800px"><header class="volunteer-heading"><p class="eyebrow">Despacho a domicilio</p><h1>Entrega a domicilio</h1><p>Busca el pedido y confirma los datos del cliente antes de registrar el despacho.</p></header><div class="input-group mb-3"><input id="pedido" class="form-control" placeholder="PED-..." aria-label="Número de pedido"><button id="buscar" type="button" class="btn btn-primary">Buscar</button></div><div id="datos" class="row border rounded p-3 mb-3"></div><p id="mensaje" role="status"></p><form id="registro" class="card p-3" hidden><label class="form-label">Empresa transportista *</label><input id="empresa" class="form-control mb-3" required maxlength="120"><label class="form-label">Número de seguimiento</label><input id="seguimiento" class="form-control mb-3" maxlength="120"><button class="btn btn-primary" type="submit">Guardar registro</button></form><button id="reintentar" class="btn btn-outline-primary" type="button" hidden>Reintentar finalización</button></main><script src="api.js"></script><script>
const modo='despacho', id=document.getElementById.bind(document), params=new URLSearchParams(location.search);
let pedido=null;
const input=id('pedido'); input.value=params.get('nPedido') || '';
async function buscar(){id('datos').textContent='Buscando...';id('registro').hidden=true;id('reintentar').hidden=true;pedido=null;
try {const p=await obtenerPedido(input.value.trim());if(!p)throw Error('Pedido no encontrado.');
if(p.modalidadEntrega!==(modo==='retiro'?'retiro_tienda':'reparto_domicilio'))throw Error('Este pedido corresponde a otra modalidad.');
if(p.estadoPago!=='APROBADO')throw Error('El pago aún no está aprobado.');pedido=p;
id('datos').replaceChildren();for(const [label,value] of [['Número de pedido',p.idPedido],['Cliente',p.nombreCliente],['RUT',p.rutCliente],['Teléfono',p.telefonoCliente],['Correo',p.correoCliente],['Producto',p.producto],['Cantidad',p.cantidad],['Dirección de entrega',p.direccion],['Región',p.region],['Comuna',p.comuna]]){const div=document.createElement('div');div.className=label==='Dirección de entrega'?'col-12 mb-2':'col-md-6 mb-2';const strong=document.createElement('strong');strong.textContent=label+': ';div.append(strong,document.createTextNode(value==null||value===''?'No registrado':String(value)));id('datos').appendChild(div)}
const r=await fetch(API_BASE_URL+'/pedidos/'+encodeURIComponent(p.idPedido)+'/entrega');if(r.ok){id('mensaje').textContent='Este pedido ya tiene una entrega registrada. Si la finalización sigue pendiente, puedes reintentarla.';id('reintentar').hidden=false;return}id('mensaje').textContent='Confirma los datos antes de guardar.';id('registro').hidden=false;
}catch(e){id('datos').textContent=e.message;id('mensaje').textContent=''}}
async function completarEnFlowable(){
 id('reintentar').disabled=true;id('mensaje').textContent='Finalizando proceso...';
 try{const r=await fetch(API_BASE_URL+'/pedidos/'+encodeURIComponent(pedido.idPedido)+'/entrega/completar',{method:'POST'});
 const data=await r.json();if(!r.ok)throw Error(data.mensaje||'No se pudo finalizar el proceso.');
 id('mensaje').textContent='Despacho registrado. Confirmando el envío...';id('reintentar').hidden=true;
 window.location.href='pantalla-despachado.html?nPedido='+encodeURIComponent(pedido.idPedido);
 }catch(err){id('mensaje').textContent='El registro se guardó, pero no se pudo finalizar el proceso. Puedes reintentarlo.';id('reintentar').hidden=false;
 }finally{id('reintentar').disabled=false}
}
 id('reintentar').onclick=completarEnFlowable;
 id('buscar').onclick=buscar;if(input.value)buscar();
id('registro').onsubmit=async e=>{e.preventDefault();if(!pedido)return;
const body=modo==='retiro'?{tipo:'RETIRO',voluntario:id('voluntario').value.trim(),rutVoluntario:id('rut').value.trim(),observaciones:id('observaciones').value.trim()}:{tipo:'DESPACHO',empresa:id('empresa').value.trim(),numeroSeguimiento:id('seguimiento').value.trim()};
try{const r=await fetch(API_BASE_URL+'/pedidos/'+encodeURIComponent(pedido.idPedido)+'/entrega',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.mensaje||'No se pudo guardar');id('registro').hidden=true;await completarEnFlowable();}catch(err){id('mensaje').textContent=err.message};
};
</script></body></html>
